version: "3.8"

services:
  untis-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxima_lectio
    restart: always
    networks:
      - proxima-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      VERBOSE: ${VERBOSE:-1}
      NO_COMMAND_UPDATE: ${NO_COMMAND_UPDATE:-0}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      TZ: Europe/Berlin
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      HEALTH_PORT: ${HEALTH_PORT:-8080}
      DB_CONNECTION_STRING: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
    volumes:
      - bot_data:/root/database
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: proxima_lectio_db
    restart: always
    networks:
      - proxima-network
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  proxima-network:
    driver: bridge

volumes:
  bot_data:
  pg_data:
